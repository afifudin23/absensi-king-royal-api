        **Request Body:**
        - `current_password` (string, required): Password saat ini
        - `new_password` (string, required, min 8 karakter): Password baru
        - `confirm_password` (string, required): Konfirmasi password baru, harus sama dengan `new_password`

        **Validasi:**
        - `current_password` harus cocok dengan password yang tersimpan
        - `new_password` dan `confirm_password` harus identik

        **Response 200:** ID pengguna

        **Error:** 400 jika password lama salah atau konfirmasi tidak cocok
