      description: |-
        Menghapus satu atau beberapa pengajuan absensi sekaligus berdasarkan daftar ID.

        **Request Body:**
        - `ids` (array of UUID, required, min 1 item): Daftar ID pengajuan yang akan dihapus

        **Response 200:** Jumlah data yang berhasil dihapus
      parameters:
      - description: Daftar ID pengajuan yang akan dihapus
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/github_com_afifudin23_absensi-king-royal-api_internal_delivery_http_request.AttendanceRequestBulkDeleteRequest'
      produces:
