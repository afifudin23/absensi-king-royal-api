      consumes:
      - application/json
      description: |-
        Mereset password menggunakan kode OTP yang telah dikirim ke email.

        **Request Body:**
        - `email` (string, required, format email): Email akun yang akan direset
        - `otp` (string, required, tepat 6 karakter): Kode OTP dari email
        - `new_password` (string, required, min 8 karakter): Password baru

        **Validasi & Behavior:**
        - OTP harus valid dan belum kadaluarsa
        - Password baru akan di-hash sebelum disimpan
        - Setelah berhasil, OTP akan dihapus dan tidak bisa digunakan lagi

        **Response 200:** Pesan konfirmasi password berhasil direset

        **Error:** 400 jika OTP tidak valid atau sudah kadaluarsa
      parameters:
      - description: Data reset password
        in: body
        name: body
        required: true
        schema:
