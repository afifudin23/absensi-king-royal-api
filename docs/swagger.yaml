  /auth/login:
    post:
      consumes:
      - application/json
      description: |-
        Login menggunakan email dan password, mengembalikan JWT access token.

        **Request Body:**
        - `email` (string, required): Alamat email akun
        - `password` (string, required): Password akun

        **Validasi & Behavior:**
        - Jika email tidak ditemukan atau password salah, request ditolak dengan 401
        - Token yang dikembalikan digunakan sebagai Bearer token di header Authorization

        **Response 200:** `access_token` (JWT), `token_type` (Bearer), data user (id, nama, email, role)

        **Error:** 401 jika kredensial salah
      parameters:
      - description: Kredensial login
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/github_com_afifudin23_absensi-king-royal-api_internal_delivery_http_request.AuthLoginRequest'
      produces:
      - application/json
      responses:
        "200":
