  /activity-logs:
    get:
      description: |-
        Mendapatkan log aktivitas seluruh pengguna dengan pagination dan filter. Akses hanya untuk admin.

        **Query Params (opsional):**
        - `page` (integer, default 1): Nomor halaman
        - `limit` (integer, default 20): Jumlah data per halaman
        - `user_id` (UUID): Filter log berdasarkan pengguna tertentu
        - `method` (string): Filter berdasarkan HTTP method — `POST`, `PUT`, `PATCH`, `DELETE`
        - `status_code` (integer): Filter berdasarkan kode HTTP response (contoh: 200, 400, 500)
        - `search` (string): Cari berdasarkan path atau deskripsi aksi

        **Behavior:** Hanya mencatat request non-GET (perubahan data). GET tidak dilog.

        **Response 200:** `data` (array log), `total` (total semua), `page`, `limit`
      parameters:
      - description: 'Nomor halaman (default: 1)'
        in: query
        name: page
        type: integer
      - description: 'Jumlah data per halaman (default: 20)'
        in: query
        name: limit
        type: integer
      - description: Filter berdasarkan user ID
        in: query
        name: user_id
        type: string
      - description: Filter berdasarkan HTTP method (GET/POST/PUT/PATCH/DELETE)
        in: query
        name: method
        type: string
      - description: Filter berdasarkan status code HTTP
        in: query
        name: status_code
        type: integer
      - description: Cari berdasarkan path atau deskripsi
        in: query
        name: search
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_afifudin23_absensi-king-royal-api_internal_delivery_http_response_common.Response-github_com_afifudin23_absensi-king-royal-api_internal_delivery_http_response_ActivityLogListResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/github_com_afifudin23_absensi-king-royal-api_internal_delivery_http_response_common.Response-any'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/github_com_afifudin23_absensi-king-royal-api_internal_delivery_http_response_common.Response-any'
      security:
      - BearerAuth: []
      summary: Daftar activity log (Admin)
      tags:
      - Activity Logs
  /attendance-requests:
    delete:
      consumes:
