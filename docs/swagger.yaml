      security:
      - BearerAuth: []
      summary: Buat pengajuan absensi
      tags:
      - Attendance Requests
  /attendance-requests/{attendance_request_id}:
    get:
      description: |-
        Mendapatkan detail satu pengajuan absensi berdasarkan ID.

        **Path Param:**
        - `attendance_request_id` (UUID): ID pengajuan yang ingin dilihat

        **Response 200:** Data lengkap pengajuan (status, tipe, tanggal, alasan, bukti, reviewer, catatan review)
