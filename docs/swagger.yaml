          schema:
            $ref: '#/definitions/github_com_afifudin23_absensi-king-royal-api_internal_delivery_http_response_common.Response-github_com_afifudin23_absensi-king-royal-api_internal_delivery_http_response_common_DeleteSuccessResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/github_com_afifudin23_absensi-king-royal-api_internal_delivery_http_response_common.Response-any'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/github_com_afifudin23_absensi-king-royal-api_internal_delivery_http_response_common.Response-any'
      security:
      - BearerAuth: []
      summary: Hapus pengajuan absensi
      tags:
      - Attendance Requests
    get:
      description: |-
        Mendapatkan daftar semua pengajuan absensi dari seluruh karyawan. Akses hanya untuk admin.

        **Query Params (opsional):**
        - `status` (string): Filter status — `pending`, `approved`, `rejected`
        - `type` (string): Filter tipe — `sick`, `leave`, `extra_off`, `overtime`
        - `start_date` (string, YYYY-MM-DD): Filter dari tanggal ini
        - `end_date` (string, YYYY-MM-DD): Filter sampai tanggal ini

        **Response 200:** Array pengajuan beserta nama karyawan, status review, dan bukti
      parameters:
      - description: Filter status (pending/approved/rejected)
        in: query
        name: status
        type: string
      - description: Filter tipe (sick/leave/extra_off/overtime)
        in: query
        name: type
        type: string
      - description: Tanggal mulai (YYYY-MM-DD)
        in: query
        name: start_date
        type: string
      - description: Tanggal selesai (YYYY-MM-DD)
        in: query
        name: end_date
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_afifudin23_absensi-king-royal-api_internal_delivery_http_response_common.Response-array_github_com_afifudin23_absensi-king-royal-api_internal_delivery_http_response_AttendanceRequestResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/github_com_afifudin23_absensi-king-royal-api_internal_delivery_http_response_common.Response-any'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/github_com_afifudin23_absensi-king-royal-api_internal_delivery_http_response_common.Response-any'
      security:
      - BearerAuth: []
      summary: Semua pengajuan absensi (Admin)
      tags:
      - Attendance Requests
    post:
      consumes:
      - application/json
      description: |-
        Membuat pengajuan kehadiran baru seperti cuti, sakit, lembur, atau libur tambahan.

        **Request Body:**
        - `start_date` (string, required, format YYYY-MM-DD): Tanggal mulai pengajuan
        - `end_date` (string, required, format YYYY-MM-DD): Tanggal selesai pengajuan
        - `reason` (string, required): Alasan pengajuan
        - `type` (string, required): Tipe — `sick`, `leave`, `extra_off`, `overtime`
        - `evidence_file_id` (UUID, opsional): ID file bukti (contoh: surat dokter untuk sakit)
        - `requested_overtime_hours` (integer, opsional): Jumlah jam lembur (khusus tipe `overtime`)

        **Response 201:** ID pengajuan yang baru dibuat
