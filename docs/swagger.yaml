        **Behavior:**
        - Endpoint ini tidak menginvalidasi token di server (stateless JWT)
        - Klien wajib menghapus `access_token` dari penyimpanan lokal setelah memanggil endpoint ini

        **Response 200:** Pesan konfirmasi logout berhasil
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_afifudin23_absensi-king-royal-api_internal_delivery_http_response_common.Response-any'
