      description: |-
        Mendaftarkan akun pengguna baru menggunakan email dan password.

        **Request Body:**
        - `full_name` (string, required, min 3 karakter): Nama lengkap pengguna
        - `email` (string, required, format email): Alamat email unik
        - `password` (string, required, min 8 karakter): Password akun

        **Validasi & Behavior:**
        - Email harus unik, jika sudah terdaftar akan mengembalikan 400
        - Password di-hash menggunakan argon2id sebelum disimpan

        **Response 201:** ID pengguna yang baru dibuat

        **Error:** 400 jika email sudah terdaftar atau validasi gagal
      parameters:
      - description: Data registrasi
        in: body
        name: body
        required: true
